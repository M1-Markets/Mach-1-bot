# Aggressive RSI Strategy Configuration
# This configuration uses more aggressive parameters for higher potential returns (and risk)

[bot]
name = "Aggressive RSI Bot"
description = "High-frequency RSI trading with aggressive parameters"

[wallet]
private_key = "your_private_key_here"

[trading]
mode = "simulation"
base_currency = "USDC"
initial_balance = 20000
max_position_size = 2000
max_daily_loss = 1000

[strategy]
type = "rsi"
id = "rsi_strategy_v1"
risk_level = "high"
trading_pairs = ["BTC/USDC", "ETH/USDC", "SOL/USDC"]

# Aggressive RSI parameters
[strategy.parameters]
rsiPeriod = 10              # Shorter period for faster signals
oversoldThreshold = 35      # Less extreme oversold level for more trades
overboughtThreshold = 65    # Less extreme overbought level for more trades
positionSize = 0.15         # Larger position size (15% of portfolio)
stopLoss = 0.08             # Wider stop loss to avoid noise

[network]
rpc_url = "https://evm-rpc-testnet.sei.io"
chain_id = 713715
