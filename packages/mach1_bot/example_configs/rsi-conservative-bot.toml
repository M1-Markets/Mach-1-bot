# Conservative RSI Strategy Configuration
# This configuration uses more conservative parameters for lower risk trading

[bot]
name = "Conservative RSI Bot"
description = "Low-risk RSI trading with conservative parameters"

[wallet]
private_key = "your_private_key_here"

[trading]
mode = "simulation"
base_currency = "USDC"
initial_balance = 5000
max_position_size = 500
max_daily_loss = 100

[strategy]
type = "rsi"
id = "rsi_strategy_v1"
risk_level = "low"
trading_pairs = ["ETH/USDC"]

# Conservative RSI parameters
[strategy.parameters]
rsiPeriod = 21              # Longer period for more stable signals
oversoldThreshold = 25      # More extreme oversold level
overboughtThreshold = 75    # More extreme overbought level
positionSize = 0.05         # Smaller position size (5% of portfolio)
stopLoss = 0.03             # Tighter stop loss (3%)

[network]
rpc_url = "https://evm-rpc-testnet.sei.io"
chain_id = 713715
