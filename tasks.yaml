# yaml-language-server: $schema=https://raw.githubusercontent.com/ffimnsr/mk-rs/main/docs/schema.json

use_npm: true

tasks:
  greet:
    commands:
      - echo "Hello, World!"
    description: Sample greet command
  spawn-dev:
    commands:
      - command: |
          podman run -it -p 3000:3000 \
            --userns=keep-id \
            --user "$(id -u):$(id -g)" \
            -v "${PWD}:/workspace" \
            -v /workspace/.npm \
            -v /workspace/node_modules \
            -w /workspace \
            node:24-bookworm bash
        interactive: true
    description: Spawn a development environment.
  format:
    commands:
      - npm run format -w packages/mach1_bot -w packages/mach1_sdk
    description: Format code in all packages.
  lint:
    commands:
      - npm run lint -w packages/mach1_bot -w packages/mach1_sdk
    description: Lint code in all packages.
  test:
    commands:
      - npm run test -w packages/mach1_bot -w packages/mach1_sdk
    description: Run tests in all packages.
  typecheck:
    commands:
      - npm run typecheck -w packages/mach1_bot -w packages/mach1_sdk
    description: Run type checks in all packages.
